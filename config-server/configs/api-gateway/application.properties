# where microservices will be published
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#
logging.pattern.console=%C{1.} [%-5level] %d{HH:mm:ss} %msg%n
#
#for correct running of api-gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
#
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=lb://order-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/order/test
spring.cloud.gateway.routes[0].predicates[1]=Method=GET
#
spring.cloud.gateway.routes[1].id=payment-service
spring.cloud.gateway.routes[1].uri=lb://payment-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/payment/test
spring.cloud.gateway.routes[1].predicates[1]=Method=GET
#
spring.cloud.gateway.routes[2].id=ticket-service-test
spring.cloud.gateway.routes[2].uri=lb://ticket-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/ticket/test
spring.cloud.gateway.routes[2].predicates[1]=Method=GET
#
spring.cloud.gateway.routes[3].id=ticket-service-all
spring.cloud.gateway.routes[3].uri=lb://ticket-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/tickets
spring.cloud.gateway.routes[3].predicates[1]=Method=GET