# where microservice will be published
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#
logging.pattern.console=%C{1.} [%-5level] %d{HH:mm:ss} %msg%n
#
eureka.instance.instance-id=${spring.application.name}:${random.value}
#
management.endpoints.web.exposure.include=*
#
property=0
#
spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=postgres
spring.datasource.password=password
#
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
#
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
kafka.topic.name.order.created=order_created
kafka.topic.name.order.paid=order_paid
#
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
kafka.topic.name.payment.approved=payment_approved
kafka.topic.name.payment.rejected=payment_rejected
kafka.topic.name.ticket.approved=ticket_approved
