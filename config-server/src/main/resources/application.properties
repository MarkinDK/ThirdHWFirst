spring.application.name=config-server
#
server.port=8888
#
spring.profiles.active=native
#
spring.cloud.config.server.native.search-locations=config-server/configs/{application}
#
spring.cloud.config.server.git.uri=https://github.com/MarkinDK/ThirdHWFirst.git
spring.cloud.config.server.git.search-paths=config-server/configs/{application}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=attempt
#
logging.pattern.console=%C{1.} [%-5level] %d{HH:mm:ss} %msg%n
